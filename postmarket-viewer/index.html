<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盤後分析</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f5f0e8;
  --surface: #ffffff;
  --surface2: #fafaf5;
  --text: #1a1714;
  --text2: #6b5f55;
  --text3: #a09888;
  --accent: #1B365D;
  --accent2: #D4A843;
  --border: #d4c9b8;
  --hover: #f0ebe3;
  --sidebar-w: 260px;
  --up: #d32f2f;
  --down: #2e7d32;
}
html, body { height:100%; font-family:'Noto Sans TC',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
.wrapper { display:flex; height:100vh; }
.up { color:var(--up); } .down { color:var(--down); }
.data-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
.data-table th { text-align:left; font-weight:600; color:var(--text3); font-size:11px; padding:4px 6px; border-bottom:1px solid var(--border); }
.data-table td { padding:3px 6px; border-bottom:1px solid var(--border2,#eee); white-space:nowrap; }
.data-table tr:last-child td { border-bottom:none; }
.data-table .stock-code { color:var(--text3); font-size:11px; }
.data-table .truncate { max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.section + .section { margin-top:16px; }
.badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:500; }
.badge-up { background:rgba(211,47,47,.1); color:var(--up); }
.badge-down { background:rgba(46,125,50,.1); color:var(--down); }

.topnav {
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
}
.nav-inner {
  max-width:1200px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; height:48px;
}
.nav-brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:14px; }
.nav-links { display:flex; gap:4px; }
.nav-links a {
  padding:5px 12px; border-radius:6px; font-size:13px;
  color:var(--text2); text-decoration:none; transition:.15s;
}
.nav-links a:hover { background:var(--hover); color:var(--text); }
.nav-links a.active { background:rgba(27,54,93,.1); color:var(--accent); font-weight:600; }

.sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:15px; font-weight:700; color:var(--accent); }
.sidebar-header .sub { font-size:11px; color:var(--text3); margin-top:2px; }
.sidebar-list { flex:1; overflow-y:auto; padding:8px; }

.pm-item {
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
  cursor:pointer; transition:all .15s; border:1px solid transparent; margin-bottom:4px;
}
.pm-item:hover { background:var(--hover); }
.pm-item.active { background:var(--surface2); border-color:var(--accent); }
.pm-item .icon {
  width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0; background:rgba(27,54,93,.08); color:var(--accent);
}
.pm-item .info { flex:1; min-width:0; }
.pm-item .date { font-size:13px; font-weight:500; }
.pm-item .day { font-size:11px; color:var(--text3); margin-left:4px; }
.pm-item .desc { font-size:11px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }

.content { flex:1; overflow-y:auto; }
.content-inner { max-width:780px; margin:0 auto; padding:24px 24px 80px; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:16px; }
.card h3 { font-size:16px; font-weight:600; color:var(--accent); margin-bottom:8px; }
.card p { font-size:14px; line-height:1.7; }
.card .section { margin-bottom:12px; }
.card .section h4 { font-size:14px; font-weight:600; color:var(--accent2); margin-bottom:4px; }

.empty-state { text-align:center; padding:80px 20px; color:var(--text3); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

@media(max-width:700px) {
  .sidebar { display:none; }
  .nav-links a { font-size:11px; padding:4px 8px; }
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">🏠 王美智</a>
    <div class="nav-links">
      <a href="../dashboard/">📊 儀表板</a>
      <a href="../stock-viewer/">🔬 個股分析</a>
      <a href="../daily-reports.html">📋 盤前晨報</a>
      <a href="../closing-viewer/">📉 收盤行情</a>
    </div>
  </div>
</nav>

<div class="wrapper">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🔍 盤後分析</h2>
      <div class="sub">推薦檢討</div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>

  <div class="content">
    <div class="content-inner" id="contentArea">
      <div class="empty-state"><div class="icon">🔍</div><p>無盤後分析</p></div>
    </div>
  </div>
</div>

<script>
const DATA_URL = '../postmarket/list.json';
async function init() {
  try {
    const res = await fetch(DATA_URL + '?_=' + Date.now());
    const data = await res.json();
    // list.json 格式: { updatedAt, reports: ["2026-06-17", ...] }
    const dates = data.reports || data;
    const list = dates.map(d => typeof d === 'string' ? {date: d, file: d, title: '盤後分析'} : d);
    renderSidebar(list);
    if (list.length > 0) loadItem(list[0]);
  } catch(e) {
    document.getElementById('sidebarList').innerHTML = '<div style="padding:12px;color:#a09888;font-size:13px;">⚠️ 載入失敗</div>';
  }
}
function renderSidebar(list) {
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('sidebarList').innerHTML = list.map(item => {
    const d = new Date(item.date);
    return `<div class="pm-item" onclick='loadItem(${JSON.stringify(item)})'>
      <div class="icon">🔍</div>
      <div class="info"><div class="date">${item.date} <span class="day">週${days[d.getDay()]}</span></div><div class="desc">${item.title||'盤後分析'}</div></div>
    </div>`;
  }).join('');
}
async function loadItem(item) {
  try {
    const fn = item.file || item.date;
    const res = await fetch(`../postmarket/${fn}.json?_=${Date.now()}`);
    const data = await res.json();
    renderContent(data);
  } catch(e) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>載入失敗</p></div>';
  }
}
function fmt(o) { return (o||o===0)?String(o).replace(/\B(?=(\d{3})+(?!\d))/g,','):'-'; }
function cls(v) { let n=parseFloat(v); if(isNaN(n)) return ''; return n>0?'up':n<0?'down':''; }
function badge(v) { let n=parseFloat(v); if(isNaN(n)) return ''; return n>0?'up':'down'; }
function dirCls(dir) { return dir==='up'||dir==='+'?'up':'down'; }

// 欄位名稱中文化
const CN = {
  self_managed:'自營商', hedge:'避險', investment_trust:'投信', foreign:'外資',
  as_of_date:'日期', taiex_futures_net_oi:'台指期淨OI', total_futures_options_net:'期權合計淨額',
  small_taiex_futures:'小台指期', put_call_ratio:'P/C Ratio', overall_assessment:'整體評估',
  margin_balance_shares:'融資餘額(張)', margin_balance_change:'融資增減',
  margin_balance_amount_100m:'融資金額(億)', margin_balance_amount_change_100m:'金額增減(億)',
  short_balance_shares:'融券餘額(張)', short_balance_change:'融券增減',
  tse_advances:'上市上漲', tse_declines:'上市下跌', tse_unchanged:'上市持平',
  tse_limit_up:'上市漲停', tse_limit_down:'上市跌停',
  otc_advances:'上櫃上漲', otc_declines:'上櫃下跌', otc_unchanged:'上櫃持平',
  otc_limit_up:'上櫃漲停', otc_limit_down:'上櫃跌停',
  advance_decline_ratio:'漲跌比',
  buy_100m:'買進(億)', sell_100m:'賣出(億)', net_100m:'淨買超(億)',
  buy_net:'買超淨額', value:'金額', amount:'額度', net_position:'淨部位',
  proprietary:'自營商', direction:'方向', oi:'OI',
  futures_oi:'期貨OI', options_oi:'選擇權OI', ratio:'比率',
  volume:'成交量', interpretation:'解讀',
  margin_short:'融資融券', short_selling_balance:'借券賣出',
  market_breadth:'漲跌家數', strong_sectors:'強勢族群', weak_sectors:'弱勢族群',
  recommendation_review:'推薦檢討', overall_assessment:'整體評估',
  market_assessment:'盤後觀點',
  generated_at:'產生時間', source:'來源',
  next_day_events:'明日關注',
  total:'合計', 買超:'買超淨額'
};
function cn(key) { return CN[key.toLowerCase()] || CN[key] || key; }

function renderContent(data) {
  let html = '';
  // ====== Title ======
  if (data.title || data.date) {
    html += `<div class="card"><h3>${data.title||'盤後分析'}</h3><p>📅 ${data.date||''}</p></div>`;
  }
  // ====== Legacy sections ======
  if (data.sections) {
    data.sections.forEach(s => {
      html += `<div class="card"><div class="section"><h4>${s.title||''}</h4><p>${(s.content||s.text||'').replace(/\n/g,'<br>')}</p></div></div>`;
    });
  }
  if (data.content) {
    html += `<div class="card"><p>${data.content.replace(/\n/g,'<br>')}</p></div>`;
  }
  
  // ====== Summary ======
  if (data.summary && typeof data.summary === 'object') {
    let md = data.market_direction || '';
    let s = data.summary;
    let taiex = s.taiex || {};
    let broad = s.broad_index || {};
    let tai50 = s.tai50 || {};
    let ts = s.trading_stats || {};
    let dir = taiex.direction || (taiex.change>0?'up':'down');
    html += `<div class="card">
      <div class="section">
        <h4>📊 加權指數 <span class="badge badge-${dirCls(dir)}">${dir==='up'?'▲':'▼'} ${taiex.change||''}</span></h4>
        <table class="data-table">
          <tr><td>收盤</td><td><b>${fmt(taiex.close)}</b></td><td class="${cls(taiex.change_pct)}">${taiex.change_pct||''}%</td></tr>
          <tr><td>漲跌</td><td class="${cls(taiex.change)}">${fmt(taiex.change)}</td><td>昨收 ${fmt(taiex.previous_close)}</td></tr>
          <tr><td>臺灣50</td><td>${fmt(tai50.close)}</td><td class="${cls(tai50.change_pct)}">${tai50.change_pct||''}%</td></tr>
          ${ts.total_volume?`<tr><td>成交量</td><td>${fmt(ts.total_volume)} 張</td><td></td></tr>`:''}
          ${ts.total_value?`<tr><td>成交值</td><td>${fmt(ts.total_value)} 億</td><td></td></tr>`:''}
          ${s.fx_usdtwd?`<tr><td>美元/台幣</td><td>${s.fx_usdtwd}</td><td class="${cls(s.fx_change_pct)}">${s.fx_change||''} (${s.fx_change_pct||''}%)</td></tr>`:''}
        </table>
      </div>
    </div>`;
  }
  
  // ====== Indices (table) ======
  if (data.indices && typeof data.indices === 'object') {
    let entries = Object.entries(data.indices);
    let ihtml = '<table class="data-table"><tr><th>指數</th><th>收盤</th><th>漲跌</th><th>%</th></tr>';
    for (const [k,v] of entries) {
      let c = v.close||v.value||'';
      let ch = v.change||v.diff||'';
      let pct = v.change_pct||v.pct||'';
      ihtml += `<tr><td class="truncate">${k}</td><td>${fmt(c)}</td><td class="${cls(ch)}">${ch}</td><td class="${cls(pct)}">${pct}%</td></tr>`;
    }
    ihtml += '</table>';
    html += `<div class="card"><div class="section"><h4>📈 指數行情 (${entries.length})</h4>${ihtml}</div></div>`;
  }
  
  // ====== Stocks (table) ======
  if (data.stocks && typeof data.stocks === 'object') {
    let entries = Object.entries(data.stocks);
    let stbl = '<table class="data-table"><tr><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌</th><th>%</th></tr>';
    for (const [code,sv] of entries) {
      let nm = sv.name||sv.n||'';
      let c = sv.close||sv.c||'';
      let ch = sv.change||sv.d||sv.diff||'';
      let pct = sv.change_pct||sv.p||'';
      stbl += `<tr><td class="stock-code">${code}</td><td class="truncate">${nm}</td><td>${fmt(c)}</td><td class="${cls(ch)}">${ch}</td><td class="${cls(pct)}">${pct}%</td></tr>`;
    }
    stbl += '</table>';
    html += `<div class="card"><div class="section"><h4>🏢 權值股 (${entries.length})</h4>${stbl}</div></div>`;
  }
  
  // ====== Sector Performance ======
  if (data.sector_performance && typeof data.sector_performance === 'object') {
    for (const [dirName, items] of Object.entries(data.sector_performance)) {
      if (!Array.isArray(items) || items.length===0) continue;
      let lbl = dirName.includes('gain')?'📗 強勢類股':'📕 弱勢類股';
      let tbl = '<table class="data-table"><tr><th>類股</th><th>漲跌</th><th>%</th></tr>';
      for (const item of items) {
        let nm = item.name||item.sector||item.n||'';
        let ch = item.change||item.d||'';
        let pct = item.change_pct||item.p||'';
        tbl += `<tr><td>${nm}</td><td class="${cls(ch)}">${ch}</td><td class="${cls(pct)}">${pct}%</td></tr>`;
      }
      tbl += '</table>';
      html += `<div class="card"><div class="section"><h4>${lbl}</h4>${tbl}</div></div>`;
    }
  }
  
  // ====== Top Movers ======
  if (data.top_movers && typeof data.top_movers === 'object') {
    for (const [dirName, items] of Object.entries(data.top_movers)) {
      if (!Array.isArray(items) || items.length===0) continue;
      let lbl = dirName.includes('gain')?'⬆️ 漲幅排行':'⬇️ 跌幅排行';
      let tbl = '<table class="data-table"><tr><th>股票</th><th>代號</th><th>收盤</th><th>%</th></tr>';
      for (const item of items) {
        let nm = item.name||item.n||item.code||'';
        let code = item.code||item.id||item.ticker||'';
        let c = item.close||item.c||'';
        let pct = item.change_pct||item.p||'';
        tbl += `<tr><td>${nm}</td><td class="stock-code">${code}</td><td>${fmt(c)}</td><td class="${cls(pct)}">${pct}%</td></tr>`;
      }
      tbl += '</table>';
      html += `<div class="card"><div class="section"><h4>${lbl}</h4>${tbl}</div></div>`;
    }
  }
  
  // ====== Postmarket (盤後資訊) ======
  if (data.postmarket && typeof data.postmarket === 'object') {
    let pm = data.postmarket;
    let phtml = '';
    // Institutional trading
    if (pm.institutional_trading) {
      let it = pm.institutional_trading;
      phtml += '<div class="section"><h4>🏛️ 三大法人買賣超</h4><table class="data-table"><tr><th>類別</th><th>買進(億)</th><th>賣出(億)</th><th>淨買超(億)</th></tr>';
      for (const [k,v] of Object.entries(it)) {
        if (k==='total') continue;
        let b = typeof v==='object'?v.buy_100m||v.buy||'':v;
        let s = typeof v==='object'?v.sell_100m||v.sell||'':v;
        let n = typeof v==='object'?v.net_100m||v.buy_net||v.net||'':v;
        phtml += `<tr><td>${cn(k)}</td><td>${fmt(b)}</td><td>${fmt(s)}</td><td class="${cls(n)}">${fmt(n)}</td></tr>`;
      }
      if (it.total) {
        let tot = typeof it.total==='object'?(it.total.buy_net||it.total.value||''):it.total;
        phtml += `<tr style="font-weight:600"><td>合計</td><td class="${cls(tot)}">${fmt(tot)}</td></tr>`;
      }
      phtml += '</table></div>';
    }
    // Futures
    if (pm.futures_positions) {
      let fp = pm.futures_positions;
      phtml += '<div class="section"><h4>📊 期貨未平倉</h4><table class="data-table">';
      for (const [k,v] of Object.entries(fp)) {
        if (k==='as_of_date') {
          phtml += `<tr><td>${cn(k)}</td><td>${v}</td></tr>`;
        } else if (typeof v === 'object' && v !== null) {
          // Show first-level summary value if available
          let val = v.net_100m||v.net_position||v.oi||v.value||v.ratio||'';
          let extra = v.interpretation?'('+v.interpretation+')':'';
          phtml += `<tr><td>${cn(k)}</td><td class="${cls(val)}">${fmt(val)} ${extra}</td></tr>`;
        } else {
          phtml += `<tr><td>${cn(k)}</td><td>${typeof v==='string'?cn(v):v}</td></tr>`;
        }
      }
      phtml += '</table></div>';
    }
    // Next day events
    if (pm.next_day_events) {
      let ev = Array.isArray(pm.next_day_events)?pm.next_day_events:[pm.next_day_events];
      phtml += '<div class="section"><h4>📅 明日關注</h4>';
      for (const e of ev) {
        let txt = typeof e==='object'?(e.event||e.title||e.text||JSON.stringify(e)):e;
        phtml += `<p style="font-size:13px;">• ${txt}</p>`;
      }
      phtml += '</div>';
    }
    // Market assessment
    if (pm.market_assessment) {
      let ma = pm.market_assessment;
      let txt = typeof ma==='object'?(ma.text||ma.assessment||ma.summary||''):ma;
      if (txt) phtml += `<div class="section"><h4>💬 盤後觀點</h4><p>${txt}</p></div>`;
    }
    if (phtml) html += `<div class="card">${phtml}</div>`;
  }
  
  // ====== Full Chip Data (完整籌碼) ======
  if (data.full_chip_data && typeof data.full_chip_data === 'object') {
    let fc = data.full_chip_data;
    let fhtml = '';
    // Margin & Short
    if (fc.margin_short) {
      let ms = fc.margin_short;
      fhtml += '<div class="section"><h4>💰 融資融券</h4><table class="data-table">';
      for (const [k,v] of Object.entries(ms)) {
        if (k==='as_of_date') {
          fhtml += `<tr><td>${cn(k)}</td><td>${v}</td><td></td></tr>`;
        } else {
          let val = typeof v==='object'?(v.value||v.amount||v.balance||''):v;
          let chg = typeof v==='object'?(v.change||v.diff||''):'';
          fhtml += `<tr><td>${cn(k)}</td><td>${fmt(val)}</td><td class="${cls(chg)}">${chg||''}</td></tr>`;
        }
      }
      fhtml += '</table></div>';
    }
    // Short selling (借券賣出餘額前5大)
    if (fc.short_selling_balance) {
      let ss = fc.short_selling_balance;
      let entries = Object.entries(ss).filter(([k,v]) => typeof v==='object' && v.current_balance).slice(0,5);
      if (entries.length > 0) {
        fhtml += '<div class="section"><h4>📉 借券賣出 (前5)</h4><table class="data-table"><tr><th>股票</th><th>前日餘額</th><th>今日餘額</th><th>增減</th></tr>';
        for (const [code, sv] of entries) {
          let nm = sv.name||'';
          let prev = sv.prev_balance||sv.prev||'';
          let cur = sv.current_balance||sv.balance||'';
          let chg = sv.change||sv.diff||(cur&&prev?cur-prev:'');
          fhtml += `<tr><td>${nm}<span class="stock-code"> ${code}</span></td><td>${fmt(prev)}</td><td>${fmt(cur)}</td><td class="${cls(chg)}">${chg}</td></tr>`;
        }
        fhtml += '</table></div>';
      }
    }
    // Market breadth
    if (fc.market_breadth) {
      let mb = fc.market_breadth;
      fhtml += '<div class="section"><h4>📋 漲跌家數</h4><table class="data-table">';
      for (const [k,v] of Object.entries(mb)) {
        if (typeof v==='object') continue;
        fhtml += `<tr><td>${cn(k)}</td><td>${v}</td></tr>`;
      }
      fhtml += '</table></div>';
    }
    // Strong/Weak sectors
    if (fc.strong_sectors && Array.isArray(fc.strong_sectors)) {
      fhtml += `<div class="section"><h4>✅ 強勢族群</h4><p>${fc.strong_sectors.join('、')}</p></div>`;
    }
    if (fc.weak_sectors && Array.isArray(fc.weak_sectors)) {
      fhtml += `<div class="section"><h4>❌ 弱勢族群</h4><p>${fc.weak_sectors.join('、')}</p></div>`;
    }
    // Recommendation review
    if (fc.recommendation_review) {
      let rr = fc.recommendation_review;
      let txt = typeof rr==='object'?(rr.text||rr.review||rr.summary||''):rr;
      if (txt) fhtml += `<div class="section"><h4>🎯 推薦檢討</h4><p>${txt}</p></div>`;
    }
    // Overall assessment
    if (fc.overall_assessment) {
      let oa = fc.overall_assessment;
      let txt = typeof oa==='object'?(oa.text||oa.assessment||oa.summary||''):oa;
      if (txt) fhtml += `<div class="section"><h4>💡 整體評估</h4><p>${txt}</p></div>`;
    }
    if (fhtml) html += `<div class="card">${fhtml}</div>`;
  }
  
  document.getElementById('contentArea').innerHTML = html || '<div class="empty-state"><div class="icon">📭</div><p>無資料</p></div>';
}
init();
</script>
</body>
</html>
